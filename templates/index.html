<!DOCTYPE html>
<html>
<head>
  <title>Secure Message Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
 
  <div class="card">
    <div class="header">
      <div class="pill">
        <div class="pill-dot"></div>
        steganography
      </div>
      <h1>Secure Message Web</h1>
      <p>Hide & extract messages inside images</p>
    </div>
 
    <div class="sep"></div>
 
    <form method="POST" enctype="multipart/form-data">
 
      <div class="field">
        <span class="field-label">Image</span>
        <label class="upload" for="image-input">
          <input type="file" id="image-input" name="image" accept="image/*" required>
          <div class="upload-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
          </div>
          <p id="upload-text"><span>Choose file</span> or drag & drop</p>
        </label>
      </div>
 
      <div class="field">
        <label class="field-label">Secret message</label>
        <textarea name="message" placeholder="Type your hidden message..."></textarea>
      </div>
 
      <div class="field">
        <label class="field-label">Key</label>
        <input type="text" name="key" placeholder="Enter passphrase" required>
      </div>
 
      <div class="btn-row">
        <button type="submit" name="mode" value="encode" class="btn btn-encode">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
          Encode
        </button>
        <button type="submit" name="mode" value="decode" class="btn btn-decode">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          Decode
        </button>
      </div>
 
    </form>
 
    <div class="result">
      <svg class="result-icon" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 16v-4m0-4h.01"/>
      </svg>
      <div>
        <div class="result-lbl">Output</div>
        <div class="result-val">{{ result }}</div>
      </div>
    </div>
 
  </div>
 
 
  <script>
    document.getElementById('image-input').addEventListener('change', function() {
      var name = this.files[0] ? this.files[0].name : null;
      var el = document.getElementById('upload-text');
      if (name) {
        el.innerHTML = '<span>' + name + '</span>';
      } else {
        el.innerHTML = '<span>Choose file</span> or drag & drop';
      }
    });
  </script>
</body>
</html>
